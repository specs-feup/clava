    "body": "Severity: high. Reproduced with native dumps in all four execution modes. Probe: `CTU01_freeFunctionsRespectNamespaces`.\n\n```cpp\n// a.cpp\nnamespace A { int run(); }\nint use() { return A::run(); }\n\n// b.cpp\nnamespace B { int run() { return 2; } }\n```\n\nExpected: `A::run` has no implementation in this project. Observed: its `getImplementation()` returns `B::run`. A consumer following that link can inspect or edit an unrelated function.\n\n`FunctionDecl.getSignature()` uses the unqualified name and parameter types. Both functions become `run()`, and `DeclarationsCache` uses that string as its key. Method-specific qualification does not protect free functions.\n\nProposed behavior: include the complete semantic scope in free-function identity. Preserve typedef/parameter normalization, and distinguish namespace identity from how a name is printed at its current location. Test both missing and present matching definitions, plus namespace aliases, when implementing the fix.",

    "body": "Severity: high. Reproduced with native dumps in all four modes. Probe: `CTU04_refQualifiedMethodsStaySeparate`.\n\n```cpp\n// api.hpp\nstruct R { int get() \u0026; int get() \u0026\u0026; };\n\n// use.cpp\n#include \"api.hpp\"\nint use(R \u0026r) { return r.get() + static_cast\u003cR\u0026\u0026\u003e(r).get(); }\n\n// impl.cpp\n#include \"api.hpp\"\nint R::get() \u0026 { return 1; }\nint R::get() \u0026\u0026 { return 2; }\n```\n\nExpected: the two calls resolve to different definitions. Observed: both `CallExpr.getDefinition()` results are the same object. The lvalue/rvalue distinction is lost by the cache key, despite being retained in the parsed function type.\n\n`CXXMethodDecl.getSignature()` adds class/namespace information and const qualification, but not the member-function ref qualifier. The first colliding implementation wins.\n\nProposed behavior: include the ref qualifier in method identity. Preserve an explicit distinction between no ref qualifier, `\u0026`, and `\u0026\u0026`. The fix must not infer it from a call's value category or generated source text.",

    "evidence": "High \u00b7 Constructed graph; native project reproduction pending",

  {
    "id": "CTU14",
    "title": "rewriting a reference invalidates a previously indexed signature",
    "body": "Severity: medium. Deterministically reproduced with real `VarDecl` and `DeclRefExpr` objects in a constructed parser graph. Probe: `CTU14_rewritingAReferenceDoesNotInvalidateItsLookupKey`. The frequency in native projects is not measured.\n\nExample graph, where `D0` and `D1` represent the same declaration location, and `R0` and `R1` represent the same reference location:\n\n```text\nD0: declaration in the AST tree\nD1: detached declaration copy with a different parser ID\nR0: reference in the AST tree, DECL -\u003e D1\nR1: detached reference copy,     DECL -\u003e D1\nowner.DIRECT -\u003e R1\n```\n\nInitially, `R0` and `R1` have equal signatures. Indexing stores the signature for `R0`, including the ID of `D1`. The first node registry then rewrites `R1.DECL` to `D0`. The next registry tries to normalize `owner.DIRECT`, which still points to `R1`.\n\nExpected: the owner's reference resolves to tree node `R0`. Observed: `R1` now has a different signature because its `DECL` field contains `D0`'s ID, so lookup misses the key indexed earlier. The owner keeps the detached reference. The test explicitly controls the registry order rather than relying on hash-map iteration.\n\n`TUnitProcessor` indexes keys before rewriting fields, then recomputes keys against mutable objects while rewriting. A node-valued signature component can therefore change during the pass.\n\nProposed behavior: define one consistent identity snapshot for indexing and all lookups, or resolve references in a phase that cannot change the keys used by later lookups. A lazy cache alone is insufficient if a node's first key calculation occurs after it was mutated. Do not add a permanent AST-node cache without an invalidation contract.",
    "evidence": "Medium \u00b7 Constructed graph; native project reproduction pending",
    "proposal": "define one consistent identity snapshot for indexing and all lookups, or resolve references in a phase that cannot change the keys used by later lookups. A lazy cache alone is insufficient if a node's first key calculation occurs after it was mutated. Do not add a permanent AST-node cache without an invalidation contract."

    "title": "ambiguity handling eagerly renders full node data",
    "body": "Severity: performance/maintainability concern. Deterministically reproduced by instrumenting node content rendering. Probe: `CTU15_ambiguityHandlingDoesNotEagerlyRenderFullNodeData`. No speedup or share of total parse time is claimed.\n\nExample: two parsed occurrences produce the same signature. `addNode()` removes that signature from the candidate map and records it as ambiguous. While doing so, it concatenates the old node and appends the new node into `collisionReport`.\n\nExpected proposed behavior: retain a bounded, compact collision record and render full node data only when diagnostic output is requested. Observed: an instrumented collision invokes full `toContentString()` twice even when no caller requests a report. The report string is retained for the processor's lifetime.\n\nThis finding is narrower than the original discussion's subtree-printing explanation. In this checkout, `ClavaNode.toString()` formats its DataStore contents. Its formatter uses short strings for referenced nodes; it does not recursively print the child tree. Likewise, node-valued signature fields already use `StringProvider.getString()`.\n\nProposed behavior: make detailed diagnostics lazy and bounded while preserving ambiguity rejection. Retain counts and a small sample of source identities if those are useful. Verify the change with allocation profiling before attributing a particular fraction of issue #270 to it.",

    "body": "Severity: medium. Reproduced by parsing a two-TU application and then using its real `GlobalManager` API, in all four modes. Probe: `CTU16_generatedGlobalReferencesFindTheirDefinition`.\n\nStart with these valid source files:\n\n```cpp\n// a.cpp\nint a() { return 1; }\n\n// b.cpp\nint b() { return 2; }\n```\n\nThen request a shared global in each TU through the API used by the file joinpoint's `addGlobal` action:\n\n```text\ndefinition  = app.globalManager.addGlobal(firstTU,  \"shared\", intType, integerLiteral(7))\ndeclaration = app.globalManager.addGlobal(secondTU, \"shared\", intType, integerLiteral(7))\napp.clearCache()\ndeclaration.getDefinition()\n```\n\nThe manager emits the equivalent of `int shared = 7;` in the first TU and `extern int shared;` in the second.\n\nExpected: the extern declaration's definition is the initialized variable in the first TU. Observed: `getDefinition()` returns the extern declaration itself. Clearing the application cache does not correct it.\n\n`GlobalManager.addGlobal()` creates variables through the factory but does not mark them with `HAS_GLOBAL_STORAGE`. `VarDecl.getDefinition()` treats a variable without that flag as local and immediately returns it. `DeclarationsCache` also excludes such nodes from its global-variable index.\n\nProposed behavior: generated global declarations must carry the same required storage/linkage metadata as parsed globals. Audit the creation API, rather than teaching every lookup consumer to guess global storage from ancestry. Preserve the passing controls for one initializer, later extern declarations, independent names, and independent applications.",

<script>
(() => {
  'use strict';
  const root = document.getElementById('cross-tu-review');
  const findings = JSON.parse(document.getElementById('cross-tu-review-data').textContent);
  const actions = ['Fix', 'Investigate', 'Dismiss'];
  const choices = Object.create(null);
  const controls = new Map();
  const detailElements = new Map();
  const storageKey = 'clava-cross-tu-review-e0cb44f2b-v1';
  const status = root.querySelector('[role="status"]');
  const decisionText = root.querySelector('textarea');

  function inlineText(parent, value) {
    value.split(/(`[^`]+`)/g).forEach(part => {
      if (part.startsWith('`') && part.endsWith('`')) {
        const code = document.createElement('code');
        code.textContent = part.slice(1, -1);
        parent.append(code);
      } else { parent.append(document.createTextNode(part)); }
    });
  }

  function explanation(parent, markdown) {
    let paragraph = [], code = [], inCode = false;
    function flushParagraph() {
      if (!paragraph.length) return;
      const p = document.createElement('p');
      inlineText(p, paragraph.join(' '));
      parent.append(p);
      paragraph = [];
    }
    function flushCode() {
      const pre = document.createElement('pre');
      const content = document.createElement('code');
      content.textContent = code.join('\n');
      pre.append(content); parent.append(pre); code = [];
    }
    markdown.split('\n').forEach(line => {
      if (line.startsWith('```')) {
        if (inCode) flushCode(); else flushParagraph();
        inCode = !inCode;
      } else if (inCode) code.push(line);
      else if (!line.trim()) flushParagraph();
      else paragraph.push(line);
    });
    flushParagraph();
    if (inCode) flushCode();
  }

  for (const finding of findings) {
    const article = document.createElement('article');
    article.className = 'review-finding';
    const heading = document.createElement('div');
    heading.className = 'review-heading';
    const description = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'review-title';
    const id = document.createElement('span'); id.className = 'review-id'; id.textContent = finding.id;
    title.append(id, document.createTextNode(finding.title));
    const evidence = document.createElement('div'); evidence.className = 'review-evidence text-small';
    evidence.textContent = finding.evidence;
    description.append(title, evidence);
    const actionGroup = document.createElement('div');
    actionGroup.className = 'review-actions';
    actionGroup.setAttribute('role', 'group');
    actionGroup.setAttribute('aria-label', finding.id + ' requested action');
    const rowControls = [];
    for (const action of actions) {
      const slot = document.createElement('div'); slot.className = 'review-action-slot';
      const label = document.createElement('label'); label.className = 'form-check review-native-label';
      const checkbox = document.createElement('input');
      checkbox.className = 'form-check-input'; checkbox.type = 'checkbox';
      checkbox.id = finding.id + '-' + action.toLowerCase();
      checkbox.setAttribute('aria-label', action + ' ' + finding.id);
      const text = document.createElement('span'); text.className = 'form-check-label'; text.textContent = action;
      label.append(checkbox, text); slot.append(label); actionGroup.append(slot);
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) choices[finding.id] = action;
        else delete choices[finding.id];
        status.textContent = '';
        update(); persist();
      });
      rowControls.push({action, checkbox});
    }
    controls.set(finding.id, rowControls);
    heading.append(description, actionGroup);
    const details = document.createElement('details');
    const summary = document.createElement('summary'); summary.className = 'cursor-interaction';
    summary.textContent = 'Example, evidence, and proposed change';
    const content = document.createElement('div'); content.className = 'review-detail';
    explanation(content, finding.body);
    details.append(summary, content);
    summary.addEventListener('click', () => setTimeout(persist, 0));
    detailElements.set(finding.id, details);
    article.append(heading, details); root.querySelector('[data-findings]').append(article);
  }

  function selected() { return findings.filter(finding => choices[finding.id]); }
  function prompt() {
    const selection = selected();
    if (!selection.length) return '';
    return 'Apply these explicit cross-TU review decisions in /home/lmsousa/Documents/Projects/SPeCS/cross-tu-experiments. '
      + 'Use clava/docs/cross-tu-review.md at baseline e0cb44f2b for the examples and proposed behavior.\n\n'
      + selection.map(finding => choices[finding.id] + ' ' + finding.id + ': ' + finding.title + '\n'
        + 'Proposed scope: ' + finding.proposal).join('\n\n')
      + '\n\nFix means implement the selected correction and regression tests. Investigate means gather evidence and update the review document without applying a production fix. '
      + 'Dismiss means record the dismissal and leave production behavior unchanged. Leave every unselected finding undecided. '
      + 'Keep performance and maintainability as priorities, preserve unrelated work, and commit completed changes.';
  }

  function update() {
    const count = selected().length;
    for (const finding of findings) {
      for (const {action, checkbox} of controls.get(finding.id)) checkbox.checked = choices[finding.id] === action;
    }
    root.querySelector('.review-count').textContent = count + ' of ' + findings.length + ' decided';
    root.querySelector('[data-bottom-count]').textContent = count + ' action' + (count === 1 ? '' : 's') + ' selected';
    decisionText.value = prompt();
    const canSend = typeof window.openai?.sendFollowUpMessage === 'function';
    root.querySelectorAll('[data-submit]').forEach(button => {
      button.disabled = count === 0;
      button.textContent = canSend ? 'Send decisions' : 'Copy decisions';
    });
    root.querySelector('[data-delivery]').textContent = canSend
      ? 'Selections take effect only when you send your decisions.'
      : 'Copy your decisions, then paste them into chat to send them. Checking boxes alone does not send a request.';
  }

  function snapshot() {
    return {
      modelContent: {review: storageKey, decisions: selected().map(finding => ({id: finding.id, action: choices[finding.id]}))},
      privateContent: {expanded: findings.filter(finding => detailElements.get(finding.id).open).map(finding => finding.id)}
    };
  }
  function persist() {
    const state = snapshot();
    try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (_) { /* Storage may be unavailable in a sandbox. */ }
    try {
      if (typeof window.openai?.setWidgetState === 'function') {
        Promise.resolve(window.openai.setWidgetState(state)).catch(() => {});
      }
    } catch (_) { /* Checkboxes remain usable without host persistence. */ }
  }
  function restore(state) {
    const content = state?.modelContent;
    if (content?.review !== storageKey || !Array.isArray(content.decisions)) return;
    Object.keys(choices).forEach(id => delete choices[id]);
    for (const choice of content.decisions) {
      if (controls.has(choice.id) && actions.includes(choice.action)) choices[choice.id] = choice.action;
    }
    const expanded = state.privateContent?.expanded;
    if (Array.isArray(expanded)) for (const [id, details] of detailElements) details.open = expanded.includes(id);
  }

  try {
    const hostState = window.openai?.widgetState;
    restore(hostState?.modelContent?.review === storageKey ? hostState : JSON.parse(localStorage.getItem(storageKey) || 'null'));
  } catch (_) { /* Default to no decisions. */ }
  window.addEventListener('openai:set_globals', event => {
    const state = event.detail?.globals?.widgetState;
    if (state) { restore(state); update(); }
  });

  async function deliver() {
    const text = prompt();
    if (!text) return;
    if (typeof window.openai?.sendFollowUpMessage === 'function') {
      try {
        await window.openai.sendFollowUpMessage({prompt: text, title: 'Apply selected cross-TU decisions'});
        status.textContent = 'Decision request submitted to chat.';
        return;
      } catch (_) { status.textContent = 'The request was not sent. Copy the decision text and paste it into chat.'; }
    }
    try {
      if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
      await navigator.clipboard.writeText(text);
      status.textContent = 'Copied. Paste into chat to send your decisions.';
    } catch (_) {
      root.querySelector('[data-decision-text]').open = true;
      decisionText.focus(); decisionText.select();
      status.textContent = 'Select and copy the decision text below, then paste it into chat. Nothing has been sent.';
    }
  }
  root.querySelectorAll('[data-submit]').forEach(button => button.addEventListener('click', deliver));
  update();
})();
</script>
