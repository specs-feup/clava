gradle.afterProject { project ->
    if (project.name == 'ClangAstParser') {
        project.tasks.named('test') {
            outputs.upToDateWhen { false }
            filter {
                excludeTestsMatching 'pt.up.fe.specs.clang.ClangResourcesTest'
                excludeTestsMatching 'pt.up.fe.specs.clang.CudaResourcesTest'
                excludeTestsMatching 'pt.up.fe.specs.clang.parser.tests.CxxCudaTest'
                excludeTestsMatching 'pt.up.fe.specs.clang.parser.tests.GeneratedParseRootTest'
                // Harness regression coverage runs separately from the fixed 116-test workload.
                excludeTestsMatching 'pt.up.fe.specs.clang.parser.AClangAstTesterResourceTest'
                excludeTestsMatching 'pt.up.fe.specs.clang.dumper.ClangCcacheAdapterTest'
                // Syntax-mode regression tests run separately; retain the same 116 parser tests.
                excludeTestsMatching 'pt.up.fe.specs.clang.dumper.ClangAstDumperSyntax*Test'
                // Added only on the Protobuf experiment branch; keep the
                // measured population identical to the shared 116-test base.
                excludeTestsMatching 'pt.up.fe.specs.clang.dumper.CXXConversionDeclTest'
                excludeTestsMatching 'pt.up.fe.specs.clang.dumper.ClangAstDumperTest'
                excludeTestsMatching 'pt.up.fe.specs.clang.wire.*'
                excludeTestsMatching 'pt.up.fe.specs.clang.codeparser.ParallelCodeParserCleanupTest'
                excludeTestsMatching 'pt.up.fe.specs.clang.dumper.ClangAstDataLifecycleTest'
                excludeTestsMatching 'pt.up.fe.specs.clang.parsers.ClavaNodeParserLifecycleTest'
                excludeTestsMatching 'pt.up.fe.specs.clang.utils.ClassesServiceConcurrencyTest'
                // Keep the frozen pre-framework 116-test benchmark cohort.
                excludeTestsMatching 'pt.up.fe.specs.clang.dumper.ClangFrameworkSearchTest'
            }
        }

        project.tasks.named('jacocoTestReport') { onlyIf { false } }
        project.tasks.named('jacocoTestCoverageVerification') { onlyIf { false } }
    }
}
