<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generated node data performance</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
body { font-family:var(--font-sans); color:var(--foreground); margin:0; background:transparent; }
#node-data-performance { width:100%; }
h2,h3 { font-weight:500; margin:0 0 8px; }
h2 { font-size:18px; }
h3 { font-size:14px; }
p { margin:0 0 14px; font-size:14px; }
.legend { display:flex; flex-wrap:wrap; gap:16px; margin:12px 0; font-size:14px; }
.legend span { display:flex; gap:7px; align-items:center; }
.swatch { display:inline-block; width:9px; height:9px; }
.before { background:var(--chart-1); }
.after { background:var(--chart-2); border-radius:50%; }
.panels { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 16px; }
.panel { min-width:0; }
.panel svg { display:block; width:100%; height:220px; }
.panel svg text { fill:var(--foreground); font-size:12px; }
.panel svg .domain,.panel svg .tick line { stroke:var(--border); }
.medians { font-size:14px; font-variant-numeric:tabular-nums; margin:8px 0 0; }
.delta { font-weight:500; }
.note { color:var(--muted-foreground); font-size:12px; margin-top:16px; }
details { margin-top:16px; font-size:14px; }
summary { cursor:default; }
table { width:100%; border-collapse:collapse; margin-top:12px; font-size:12px; font-variant-numeric:tabular-nums; }
th,td { text-align:left; padding:8px 4px; border-bottom:1px solid var(--border); overflow-wrap:anywhere; }
th { font-weight:500; }
.controls { margin-top:12px; font-size:12px; color:var(--muted-foreground); overflow-wrap:anywhere; }
.tooltip { position:absolute; pointer-events:none; padding:8px 10px; background:var(--popover); color:var(--popover-foreground); border-radius:var(--radius); font-size:12px; max-width:180px; }
@media(max-width:540px) { .panels { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main id="node-data-performance">
<h2>Generated node data performance</h2>
<p id="subtitle"></p>
<div class="legend" aria-label="Series">
<span><i class="swatch before" aria-hidden="true"></i>Parent commit</span>
<span><i class="swatch after" aria-hidden="true"></i>Generated bases, after fixes</span>
</div>
<div class="panels" id="panels"></div>
<p class="note">Each panel shows its own seconds scale. Points are individual runs; lines pair the same round. Thick marks show medians. Positive changes mean slower.</p>
<details>
<summary>Run samples and controls</summary>
<div id="sample-table"></div>
<div class="controls" id="controls"></div>
</details>
<div class="tooltip" role="tooltip" id="tip" hidden></div>
</main>
<script>
const benchmark = {"baseline": "aa0946736bf241d9bac27a1c8825fffd4df0b2ba", "current": "b8f33466bf43cc3425f5b22c5f49f50d8b466e96", "shared": {"specs-java-libs": "ae7194a7b3e981913d40a4403acfc759808b6c3a", "lara-framework": "b780d0b8ba0aac2670ad5aa98998883a2a4f8030"}, "settings": {"repeats": 4, "modes": ["direct", "warm"], "wall": false, "release": "v18.1.8_7-rc4", "host": "specs-A3", "platform": "Linux-7.0.0-28-generic-x86_64-with-glibc2.43", "cpu": "Intel(R) Core(TM) i7-9700 CPU @ 3.00GHz", "java": "openjdk version \"26.0.1\" 2026-04-21\nOpenJDK Runtime Environment (build 26.0.1+8-2-26.04.2-Ubuntu)\nOpenJDK 64-Bit Server VM (build 26.0.1+8-2-26.04.2-Ubuntu, mixed mode, sharing)\n", "node": "v26.7.0", "harness_sha256": "3dbc28c15b610f6e65c687dd5fd43b8184693fc33a6bb27ba16ac30d377233f7"}, "created_utc": "2026-10-13T03:22:08.585426+00:00", "completed_utc": "2026-10-13T03:43:37.952963+00:00", "results_sha256": "5c79a0aa29a886b5df53d237242b664c1155904ca274670e1722ca35d18b76b8", "raw_results": "/home/lmsousa/.cache/clava-data-bases-performance/20261013T032207Z/results.json", "cells": [{"suite": "clava-js", "mode": "direct", "metrics": {"app_s": {"baseline": {"samples": [8.25336512, 7.898561215, 7.888461239000001, 7.950571394], "median": 7.9245663045, "min": 7.888461239000001, "max": 8.25336512}, "current": {"samples": [7.975517339, 7.976962388, 7.968983754, 7.959924995000001], "median": 7.9722505465, "min": 7.959924995000001, "max": 7.976962388}, "median_change_percent": 0.6017268348543103, "paired_change_percent": [-3.366478726679667, 0.9926006884786842, 1.020763271319658, 0.11764690280071655]}, "instrumented_command_s": {"baseline": {"samples": [34.20687470724806, 31.673727251123637, 32.2379036876373, 32.71326274611056], "median": 32.47558321687393, "min": 31.673727251123637, "max": 34.20687470724806}, "current": {"samples": [33.037905196193606, 33.124319788999856, 32.37403887696564, 32.91441099718213], "median": 32.97615809668787, "min": 32.37403887696564, "max": 33.124 ": [45.81441033817828, 28.826441975310445, 28.89264169288799, 28.968477435875684], "median": 28.930559564381838, "min": 28.826441975310445, "max": 45.81441033817828}, "median_change_percent": 1.4415210157426417, "paired_change_percent": [55.17478294725666, 1.9270995973803773, 1.568673521248476, 1.3150180957586688]}}}, {"suite": "java", "mode": "warm", "metrics": {"app_s": {"baseline": {"samples": [12.082594506, 11.957332609000002, 12.004733158999999, 12.804024542999999], "median": 12.043663832499998, "min": 11.957332609000002, "max": 12.804024542999999}, "current": {"samples": [12.939768612, 12.393407096, 12.263675592, 12.429646854000001], "median": 12.411526975000001, "min": 12.263675592, "max": 12.939768612}, "median_change_percent": 3.0544122421228614, "paired_change_percent": [7.094288445866015, 3.646921109075585, 2.157002821890064, -2.9239063682103827]}, "instrumented_command_s": {"baseline": {"samples": [18.875655503943563, 18.8147271447815, 18.717690878082067, 20.097397199831903], "median": 18.84519132436253, "min": 18.717690878082067, "max": 20.097397199831903}, "current": {"samples": [21.531051631085575, 19.368800005875528, 19.324238718952984, 19.334648680873215], "median": 19.35172434337437, "min": 19.324238718952984, "max": 21.531051631085575}, "median_change_percent": 2.687863499464771, "paired_change_percent": [14.067835294976838, 2.9448891649098696, 3.240505705653951, -3.7952602089442067]}}}], "checks": {"all_cells_valid": true, "all_cache_gates_passed": true, "source_content_differences": 0, "java_tests": 116, "java_app_calls": 216, "js_tests": 164, "js_passed": 158, "js_skipped": 6, "js_app_calls": 170}, "uncertainty": "Ranges are observed minima and maxima, not confidence intervals. Four runs do not prove exact equivalence.", "command_time": "Full command time from App-instrumented runs, including process/Gradle startup and test work outside App.build.", "driver_sha256": "64339ebb62641dba2490f9e60a3df1e7aff49eb98e828cb91a4d212f0d0dde4e"};
const root = document.getElementById('node-data-performance');
const tip = root.querySelector('#tip');
const format = d3.format('.2f');
const pct = x => (x >= 0 ? '+' : '') + x.toFixed(1) + '%';
root.querySelector('#subtitle').textContent = `${benchmark.settings.repeats} matched repeats · App time in seconds · lower is better`;
const labels = { 'clava-js':'JS', java:'Java' };
function draw(cell, container) {
  const width = container.getBoundingClientRect().width;
  const height = 220;
  const margin = {top:14, right:18, bottom:54, left:64};
  const stats = cell.metrics.app_s;
  const values = [...stats.baseline.samples, ...stats.current.samples];
  const ext = d3.extent(values);
  const pad = Math.max((ext[1]-ext[0])*0.16, ext[1]*0.025);
  const y = d3.scaleLinear().domain([Math.max(0,ext[0]-pad),ext[1]+pad]).nice().range([height-margin.bottom,margin.top]);
  const x = d3.scalePoint().domain(['baseline','current']).range([margin.left+28,width-margin.right-28]);
  const svg = d3.select(container).select('svg').attr('viewBox',`0 0 ${width} ${height}`).attr('role','img');
  svg.selectAll('*').remove();
  svg.append('title').text(`${labels[cell.suite]} ${cell.mode}: median ${format(stats.baseline.median)} to ${format(stats.current.median)} seconds, ${pct(stats.median_change_percent)}. All ${benchmark.settings.repeats} samples retained.`);
  svg.append('rect').attr('data-chart-frame','').attr('x',margin.left).attr('y',margin.top)
    .attr('width',width-margin.left-margin.right).attr('height',height-margin.bottom-margin.top)
    .attr('fill','none').attr('stroke','var(--border)');
  svg.append('g').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(4).tickFormat(d3.format('.1f')));
  svg.append('g').attr('transform',`translate(0,${height-margin.bottom})`)
    .call(d3.axisBottom(x).tickFormat(s=>s==='baseline'?'Parent':'After fixes').tickSize(0).tickPadding(10));
  svg.append('text').attr('class','axis-title').attr('data-axis','y')
    .attr('transform',`translate(14,${(margin.top+height-margin.bottom)/2}) rotate(-90)`).attr('text-anchor','middle').text('App time (s)');
  svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(margin.left+width-margin.right)/2)
    .attr('y',height-5).attr('text-anchor','middle').text('Consumer revision');
  const offset = i => (i-(benchmark.settings.repeats-1)/2)*8;
  stats.baseline.samples.forEach((v,i)=> {
    svg.append('line').attr('x1',x('baseline')+offset(i)).attr('x2',x('current')+offset(i))
      .attr('y1',y(v)).attr('y2',y(stats.current.samples[i])).attr('stroke','var(--border)').attr('stroke-width',1);
  });
  for (const [stage,color] of [['baseline','var(--chart-1)'],['current','var(--chart-2)']]) {
    stats[stage].samples.forEach((v,i)=> {
      const cx=x(stage)+offset(i),cy=y(v);
      if(stage==='baseline') svg.append('rect').attr('x',cx-3).attr('y',cy-3).attr('width',6).attr('height',6).attr('fill',color);
      else svg.append('circle').attr('cx',cx).attr('cy',cy).attr('r',3.5).attr('fill',color);
      svg.append('circle').attr('cx',cx).attr('cy',cy).attr('r',16).attr('fill','transparent').attr('data-chart-hit','')
       .on('pointermove',event=> {
          const bounds=root.getBoundingClientRect();
          tip.textContent=`${stage==='baseline'?'Parent':'After fixes'} · round ${i+1}: ${format(v)} s`;
          tip.hidden=false;
          const maxLeft=bounds.width-210;
          tip.style.left=Math.max(0,Math.min(event.clientX-bounds.left+12,maxLeft))+'px';
          tip.style.top=(event.clientY-bounds.top+12)+'px';
       }).on('pointerleave',()=>{tip.hidden=true;});
    });
    svg.append('line').attr('x1',x(stage)-24).attr('x2',x(stage)+24).attr('y1',y(stats[stage].median)).attr('y2',y(stats[stage].median))
      .attr('stroke',color).attr('stroke-width',3);
  }
}
benchmark.cells.forEach(cell=> {
 const section=document.createElement('section'); section.className='panel';
 const title=document.createElement('h3'); title.textContent=`${labels[cell.suite]} · ${cell.mode==='warm'?'Warm cache':'Direct'}`;
 section.append(title);
 const plot=document.createElement('div'); plot.innerHTML='<svg></svg>'; section.append(plot);
 const stats=cell.metrics.app_s;
 const text=document.createElement('p'); text.className='medians';
 text.textContent=`${format(stats.baseline.median)} → ${format(stats.current.median)} s · median `;
 const delta=document.createElement('span'); delta.className='delta'; delta.textContent=pct(stats.median_change_percent); text.append(delta); section.append(text);
 root.querySelector('#panels').append(section);
 new ResizeObserver(()=>draw(cell,plot)).observe(plot); draw(cell,plot);
});
const table=document.createElement('table');
table.innerHTML='<thead><tr><th>Workload</th><th>Parent samples (s)</th><th>After samples (s)</th></tr></thead><tbody></tbody>';
for(const cell of benchmark.cells) {
 const row=document.createElement('tr');
 for(const value of [`${labels[cell.suite]} ${cell.mode}`,cell.metrics.app_s.baseline.samples.map(format).join(', '),cell.metrics.app_s.current.samples.map(format).join(', ')]) {
  const td=document.createElement('td'); td.textContent=value; row.append(td);
 }
 table.querySelector('tbody').append(row);
}
root.querySelector('#sample-table').append(table);
root.querySelector('#controls').textContent = `Parent ${benchmark.baseline.slice(0,9)} · after ${benchmark.current.slice(0,9)} · ${benchmark.settings.release}. Same dependency revisions, frozen tests and source contents; all cache/workload gates passed. Java: 116 tests, 216 App calls, 512 MiB heap. JS: 158 passed, 6 skipped, 170 App calls. Ranges are observed variation, not confidence intervals. Historical thread figures used a different release/dependency snapshot and are not the control here.`;
root.style.position='relative';
console.log('Chart ready:',benchmark.cells.length,'workloads;',benchmark.settings.repeats,'repeats; all samples shown');
</script>
</body>
</html>
