plugins {
    id 'distribution'
    id 'java'
    id 'jacoco'
    id 'com.google.protobuf' version '0.9.4'
}

// Keep the wire schema in the clang-dumper checkout. A normal checkout uses
// the repository-relative sibling; CI or a packaged source tree can override
// this with -PclangDumperRoot=/path/to/clang-dumper. The override is
// intentionally explicit so generated sources never depend on a developer's
// absolute worktree path.
def clangDumperRoot = file(providers.gradleProperty('clangDumperRoot').orElse('../../clang-dumper').get())
def wireSchemaDir = new File(clangDumperRoot, 'wire')
def wireSchema = new File(wireSchemaDir, 'clava_ast_wire.proto')
if (!wireSchema.isFile()) {
    throw new GradleException("Could not find the protobuf schema at '${wireSchema}'. "
            + "Use -PclangDumperRoot=/path/to/clang-dumper for an external checkout.")
}

// The native clang-dumper and Java runtime must use the same compiler/runtime
// release.  Keep both values pinned here; update them together with the
// native CMake pin and record the revision in the release manifest.
def protobufVersion = '4.28.3'
def protocVersion = '4.28.3'
def protoSchemaHashDir = file("$buildDir/generated/source/proto-schema/main")

tasks.register('generateProtoSchemaHash') {
    inputs.file wireSchema
    outputs.file new File(protoSchemaHashDir, 'pt/up/fe/specs/clang/wire/ProtoSchemaHash.java')
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(wireSchema.bytes)
        def hash = digest.collect { String.format('%02x', it & 0xff) }.join()
        def output = new File(protoSchemaHashDir, 'pt/up/fe/specs/clang/wire/ProtoSchemaHash.java')
        output.parentFile.mkdirs()
        output.text = """/** Generated from clang-dumper/wire/clava_ast_wire.proto. */
package pt.up.fe.specs.clang.wire;
final class ProtoSchemaHash {
    static final String VALUE = \"${hash}\";
    private ProtoSchemaHash() { }
}
"""
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }

    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {}
            }
        }
    }
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Repositories providers
repositories {
    mavenCentral()
}

dependencies {
    implementation ":ClavaAst"
    implementation ":CommonsLangPlus"
    implementation ":jOptions"
    implementation ":SpecsUtils"

    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"

    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'com.google.guava:guava:33.4.0-jre'
    implementation 'com.github.luben:zstd-jni:1.5.7-16'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.9'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

// Project sources
sourceSets {
    main {
        proto {
            srcDir wireSchemaDir
        }
        java {
            srcDir 'src'
            srcDir protoSchemaHashDir
        }
        resources {
            srcDir 'resources'
        }
    }

    test {
        java {
            srcDir 'test'
        }
        resources {
            srcDir 'test-resources'
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateProtoSchemaHash')
}

processResources {
    from('clang-dumper-release.tag')
    from('cuda-release.tag')
}

// Test coverage configuration
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }

    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70 // 70% minimum coverage
            }
        }
    }
}

// Make sure jacoco report is generated after tests
test {
    useJUnitPlatform()

    // Can't parellelize because it will trigger multiple simultaneous downloads of the dumper and stdlib zip files.
    maxParallelForks = 1

    finalizedBy jacocoTestReport
}
