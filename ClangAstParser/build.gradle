plugins {
    id 'distribution'
    id 'java'
    id 'jacoco'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Repositories providers
repositories {
    mavenCentral()
}

dependencies {
    implementation ":ClavaAst"
    implementation ":CommonsLangPlus"
    implementation ":jOptions"
    implementation ":SpecsUtils"

    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'com.google.guava:guava:33.4.0-jre'
    implementation 'com.github.luben:zstd-jni:1.5.7-16'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.9'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

// Project sources
sourceSets {
    main {
        java {
            srcDir 'src'
        }
        resources {
            srcDir 'resources'
        }
    }

    test {
        java {
            srcDir 'test'
        }
        resources {
            srcDir 'test-resources'
        }
    }
}

processResources {
    from('clang-dumper-release.tag')
    from('cuda-release.tag')
}

// Test coverage configuration
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }

    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70 // 70% minimum coverage
            }
        }
    }
}

// Make sure jacoco report is generated after tests
test {
    useJUnitPlatform()

    // Can't parellelize because it will trigger multiple simultaneous downloads of the dumper and stdlib zip files.
    maxParallelForks = 1

    finalizedBy jacocoTestReport
}

// The experiment uses the matching native worktree's schema at build time.
def wireNative = file(System.getenv('FLAT_NATIVE') ?: '../../../clang-dumper-ast-flatbuffers')
def wireSdk = file(System.getenv('FLATBUFFERS_ROOT') ?: "${System.getProperty('user.home')}/.cache/ast-flatbuffers-planning/flatbuffers")
def wireGenerated = layout.buildDirectory.dir('generated/sources/wire')
tasks.register('generateCompleteWire', Exec) {
    inputs.files(fileTree(new File(wireNative, 'wire/v2')) { include '*.fbs' })
    inputs.file(new File(wireNative, 'scripts/generate_complete_wire.py'))
    outputs.dir(wireGenerated)
    commandLine 'python3', new File(wireNative, 'scripts/generate_complete_wire.py'),
        '--flatc', new File(wireSdk, 'build-make/flatc'), '--sdk', wireSdk,
        '--out', layout.buildDirectory.dir('wire-reflection').get().asFile,
        '--java-out', wireGenerated.get().asFile
}
sourceSets.main.java.srcDir(wireGenerated)
compileJava.dependsOn('generateCompleteWire')

// Compile the Java runtime from the same pinned SDK as flatc.
sourceSets.main.java.srcDir(new File(wireSdk, 'java/src/main/java'))
