plugins {
    id 'distribution'
    id 'java'
    id 'jacoco'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Repositories providers
repositories {
    mavenCentral()
}

dependencies {
    implementation ":ClavaAst"
    implementation ":CommonsLangPlus"
    implementation ":jOptions"
    implementation ":SpecsUtils"

    implementation 'com.google.code.gson:gson:2.12.1'
    // Reads the AST wire stream through the schema's binary reflection (see the wireSchema task).
    implementation 'com.google.flatbuffers:flatbuffers-java:25.2.10'
    implementation 'com.google.guava:guava:33.4.0-jre'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.9'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

// Project sources
sourceSets {
    main {
        java {
            srcDir 'src'
        }
        resources {
            srcDir 'resources'
        }
    }

    test {
        java {
            srcDir 'test'
        }
        resources {
            srcDir 'test-resources'
        }
    }
}

processResources {
    from('clang-dumper-release.tag')
    from('cuda-release.tag')
}

// Fetches the binary wire schema of the clang-dumper selected in clang-dumper-release.tag (a release tag or the
// absolute path of a local build) and its schema hash from the release manifest. See WIRE_FORMAT.md.
def wireSchemaDir = layout.buildDirectory.dir('generated/wire-schema')
def wireSchema = tasks.register('wireSchema') {
    def tagFile = file('clang-dumper-release.tag')
    inputs.file(tagFile)
    outputs.dir(wireSchemaDir)
    // A local build can change without the tag changing.
    outputs.upToDateWhen { !new File(tagFile.text.trim()).absolute }
    doLast {
        def tag = tagFile.text.trim()
        def read = { String name ->
            new File(tag).absolute ? new File(tag, name).bytes
                    : URI.create("https://github.com/specs-feup/clang-dumper/releases/download/$tag/$name").toURL().bytes
        }
        def manifest = new groovy.json.JsonSlurper().parse(read('clang-dumper-release-manifest.json'))
        def asset = manifest.assets.find { it.kind == 'wire-schema-bfbs' }
        if (asset == null) {
            throw new GradleException("clang-dumper '$tag' does not publish a binary wire schema")
        }
        def bfbs = read(asset.filename)
        if (java.security.MessageDigest.getInstance('SHA-256').digest(bfbs).encodeHex().toString() != asset.sha256) {
            throw new GradleException("Checksum mismatch for ${asset.filename} of clang-dumper '$tag'")
        }
        def out = wireSchemaDir.get().dir('pt/up/fe/specs/clang/wire').asFile
        out.mkdirs()
        new File(out, 'ast-wire.bfbs').bytes = bfbs
        new File(out, 'ast-wire.sha256').text = manifest.wire_schema.sha256 + '\n'
    }
}
sourceSets.main.resources.srcDir(files(wireSchemaDir).builtBy(wireSchema))

// Test coverage configuration
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }

    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70 // 70% minimum coverage
            }
        }
    }
}

// Make sure jacoco report is generated after tests
test {
    useJUnitPlatform()

    // Can't parellelize because it will trigger multiple simultaneous downloads of the dumper and stdlib zip files.
    maxParallelForks = 1

    finalizedBy jacocoTestReport
}
