plugins {
    id 'distribution'
    id 'java'
    id 'jacoco'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Repositories providers
repositories {
    mavenCentral()
}

dependencies {
    implementation ":ClavaAst"
    implementation ":CommonsLangPlus"
    implementation ":jOptions"
    implementation ":SpecsUtils"

    implementation 'com.google.code.gson:gson:2.12.1'
    // Reads the AST wire stream through the schema's binary reflection (see the wireSchema task).
    implementation 'com.google.flatbuffers:flatbuffers-java:25.2.10'
    implementation 'com.google.guava:guava:33.4.0-jre'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.9'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

// Project sources
sourceSets {
    main {
        java {
            srcDir 'src'
        }
        resources {
            srcDir 'resources'
        }
    }

    test {
        java {
            srcDir 'test'
        }
        resources {
            srcDir 'test-resources'
        }
    }
}

processResources {
    from('clang-dumper-release.tag')
    from('cuda-release.tag')
}

// ClavaAst owns the schema used for generation and parsing, including in composite builds.
def wireSchemaDir = file('../ClavaAst/build/generated/wire-schema')
def wireSchema = tasks.register('wireSchema') { dependsOn gradle.includedBuild('ClavaAst').task(':wireSchema') }
sourceSets.main.resources.srcDir(files(wireSchemaDir).builtBy(wireSchema))
tasks.register('updateWireFields') { dependsOn gradle.includedBuild('ClavaAst').task(':updateWireFields') }
tasks.register('verifyWireFields') { dependsOn gradle.includedBuild('ClavaAst').task(':verifyWireFields') }
tasks.named('check') {
    dependsOn tasks.named('verifyWireFields'), gradle.includedBuild('ClavaAst').task(':check')
}

// Test coverage configuration
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }

    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70 // 70% minimum coverage
            }
        }
    }
}

// Make sure jacoco report is generated after tests
test {
    useJUnitPlatform()

    // Can't parellelize because it will trigger multiple simultaneous downloads of the dumper and stdlib zip files.
    maxParallelForks = 1

    finalizedBy jacocoTestReport
}
