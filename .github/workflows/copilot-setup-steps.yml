name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed
# Allows for streamlined validation,
# and allow manual testing through the repository's "Actions" tab

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/scripts/resolve-dependency-refs.sh
      - .github/scripts/test-resolve-dependency-refs.sh
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/scripts/resolve-dependency-refs.sh
      - .github/scripts/test-resolve-dependency-refs.sh

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  # The job MUST be called `copilot-setup-steps`
  # otherwise it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Permissions set just for the setup steps
    # Copilot has permissions to its branch

    permissions:
      # To allow us to clone the repo for setup
      contents: read

    # The setup steps - install our dependencies
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Checkout clava
        uses: actions/checkout@v6
        with:
          path: clava
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test dependency ref resolver
        run: bash clava/.github/scripts/test-resolve-dependency-refs.sh

      - name: Determine repository refs
        id: repo-refs
        shell: bash
        env:
          SOURCE_BRANCH: ${{ env.BRANCH_NAME }}
        run: |
          bash clava/.github/scripts/resolve-dependency-refs.sh \
            clava \
            lara specs-feup/lara-framework \
            specs specs-feup/specs-java-libs

      - name: Echo checks
        run: |
          echo "Weaver branch: ${{ env.BRANCH_NAME }}"
          echo "Lara framework branch: ${{ steps.repo-refs.outputs.lara_branch }}"
          echo "Lara framework commit: ${{ steps.repo-refs.outputs.lara_ref }}"
          echo "Lara framework default: ${{ steps.repo-refs.outputs.lara_default }}"
          echo "Specs-java-libs branch: ${{ steps.repo-refs.outputs.specs_branch }}"
          echo "Specs-java-libs commit: ${{ steps.repo-refs.outputs.specs_ref }}"
          echo "Specs-java-libs default: ${{ steps.repo-refs.outputs.specs_default }}"

      - name: Checkout lara-framework
        uses: actions/checkout@v6
        with:
          repository: specs-feup/lara-framework
          path: lara-framework
          ref: ${{ steps.repo-refs.outputs.lara_ref }}

      - name: Checkout specs-java-libs
        uses: actions/checkout@v6
        with:
          repository: specs-feup/specs-java-libs
          path: specs-java-libs
          ref: ${{ steps.repo-refs.outputs.specs_ref }}

      - name: Build Weaver
        run: |
          cd clava/ClavaWeaver
          gradle installDist

      - name: Setup java-binaries symlink
        run: |
          cd clava/Clava-JS
          ln -s ../ClavaWeaver/build/install/ClavaWeaver/ java-binaries


      - name: Setup JS workspace
        run: |
          echo '{ "name": "SPeCS Workspace", "type": "module", "workspaces": [ "clava/Clava-JS", "lara-framework/Lara-JS" ] }' > package.json
          npm install

      - name: Build Lara-JS
        run: |
          cd lara-framework/Lara-JS
          npm run build

      - name: Build Clava-JS
        run: |
          cd clava/Clava-JS
          npm run build
